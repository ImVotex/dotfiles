output HDMI-A-2 resolution 1920x1080 position 0,0 scale 1
output HDMI-A-2 allow_tearing yes
output HDMI-A-2 max_render_time off

gaps inner 0
gaps outer 0
default_border pixel 3
default_floating_border pixel 3

client.focused          #35689e #35689e #ffffff #35689e #35689e
client.focused_inactive #1e1e1e #1e1e1e #aaaaaa #1e1e1e #1e1e1e
client.unfocused        #181818 #181818 #808080 #181818 #181818
client.urgent           #ff4d4d #ff4d4d #ffffff #ff4d4d #ff4d4d

font pango:JetBrainsMono Nerd Font 10

# Different windows
for_window [window_role = "pop-up"] floating enable
for_window [window_role = "bubble"] floating enable
for_window [window_role = "dialog"] floating enable
for_window [window_type = "dialog"] floating enable
for_window [window_role = "task_dialog"] floating enable
for_window [window_type = "menu"] floating enable
for_window [app_id = "floating"] floating enable

# Firefox
for_window [title = "About Mozilla Firefox"] floating enable
for_window [window_role = "About"] floating enable
for_window [title = "Firefox - Sharing Indicator"] kill
for_window [title = "Firefox — Sharing Indicator"] kill

# xdg-desktop-portal
for_window [app_id="(?i).*xdg-desktop-portal-gtk.*"] floating enable; move position center;
for_window [class="(?i).*xdg-desktop-portal-gtk.*"] floating enable; move position center;

# steam
for_window [class="^(steam$)" title="^(?!Steam$)"] floating enable
